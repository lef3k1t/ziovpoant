name: build

on:
  push:
    branches:
      - main
      - "task/**"
      - "task-*"
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Install
        run: cmake --install build --config Release --prefix artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZIOVPOANT-windows-x64
          path: artifact
